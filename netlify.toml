# Sajt je čist statički HTML — nema build koraka.
# Netlify: prevuci ceo folder na app.netlify.com/drop, ili poveži git repo.

[build]
  publish = "."
  command = ""

[[headers]]
  for = "/assets/images/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/assets/fonts/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
